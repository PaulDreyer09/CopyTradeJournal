<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Remove Every 4th Line</title>
<style>
  body {
    font-family: -apple-system, Arial, sans-serif;
    max-width: 900px;
    margin: 40px auto;
    padding: 0 20px;
    background: #f7f7f8;
    color: #222;
  }
  h1 { font-size: 1.4em; }
  .columns {
    display: flex;
    gap: 20px;
    flex-wrap: wrap;
  }
  .col {
    flex: 1;
    min-width: 280px;
    display: flex;
    flex-direction: column;
  }
  textarea {
    width: 100%;
    height: 400px;
    box-sizing: border-box;
    font-family: monospace;
    font-size: 14px;
    padding: 10px;
    border: 1px solid #ccc;
    border-radius: 6px;
    resize: vertical;
  }
  button {
    margin: 16px 0;
    padding: 10px 18px;
    font-size: 15px;
    border: none;
    border-radius: 6px;
    background: #5046e5;
    color: white;
    cursor: pointer;
  }
  button:hover { background: #3f37c9; }
  label { font-weight: bold; margin-bottom: 6px; display: block; }
</style>
</head>
<body>

<h1>Remove Every 4th Line</h1>
<p>Paste your text below. Lines 4, 8, 12, etc. will be removed.</p>

<div class="columns">
  <div class="col">
    <label for="input">Input</label>
    <textarea id="input" placeholder="Paste your lines here..."></textarea>
  </div>
  <div class="col">
    <label for="output">Output</label>
    <textarea id="output" placeholder="Result will appear here..." readonly></textarea>
  </div>
</div>

<button onclick="processText()">Remove every 4th line</button>
<button onclick="swapLines()">Swap line 1 &amp; 2 of every group of 3</button>

<script>
function processText() {
  const input = document.getElementById('input').value;
  const lines = input.split('\n');
  const result = lines.filter((_, index) => (index + 1) % 4 !== 0);
  document.getElementById('output').value = result.join('\n');
}

function swapLines() {
  const output = document.getElementById('output');
  const lines = output.value.split('\n');
  const result = [];

  for (let i = 0; i < lines.length; i += 3) {
    const group = lines.slice(i, i + 3);
    if (group.length === 3) {
      result.push(group[1], group[0], group[2]);
    } else {
      result.push(...group);
    }
  }

  output.value = result.join('\n');
}
</script>

</body>
</html>
